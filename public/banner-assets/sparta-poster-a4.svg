<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754" fill="none">
  <!-- Background -->
  <rect width="1240" height="1754" fill="#0B0F0D"/>
  
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D06C"/>
      <stop offset="60%" stop-color="#00A859"/>
      <stop offset="100%" stop-color="#00753E"/>
    </linearGradient>

    <linearGradient id="topShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F0D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B0F0D" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="bottomShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B0F0D" stop-opacity="0"/>
      <stop offset="35%" stop-color="#0B0F0D" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B0F0D" stop-opacity="1"/>
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow Orbs -->
  <circle cx="620" cy="100" r="350" fill="#00A859" fill-opacity="0.18" filter="url(#goldGlow)"/>
  <circle cx="150" cy="700" r="250" fill="#D4AF37" fill-opacity="0.1" filter="url(#goldGlow)"/>
  <circle cx="1090" cy="700" r="250" fill="#D4AF37" fill-opacity="0.1" filter="url(#goldGlow)"/>

  <!-- ================= TOP HEADER ================= -->
  <!-- Top Background Gradient Overlay -->
  <rect x="0" y="0" width="1240" height="480" fill="url(#topShadow)"/>

  <!-- Pill Badge -->
  <g transform="translate(420, 55)">
    <rect width="400" height="38" rx="19" fill="#D4AF37" fill-opacity="0.12" stroke="#D4AF37" stroke-opacity="0.5" stroke-width="1"/>
    <circle cx="22" cy="19" r="4.5" fill="#00D06C"/>
    <text x="36" y="24" fill="#F3E5AB" font-family="'Inter', 'Montserrat', sans-serif" font-size="13.5" font-weight="700" letter-spacing="1.5">ОФИЦИАЛЬНЫЙ НАБОР 4–14 ЛЕТ</text>
  </g>

  <!-- Brand Title -->
  <text x="620" y="145" text-anchor="middle" fill="url(#goldGrad)" font-family="'Inter', 'Unbounded', sans-serif" font-size="24" font-weight="900" letter-spacing="2">ЦСП «СПАРТА» • НОВОСИБИРСК</text>
  <text x="620" y="172" text-anchor="middle" fill="#E6E8E6" font-family="'Inter', 'Onest', sans-serif" font-size="14" font-weight="600" letter-spacing="1">ЦЕНТР СПОРТИВНОЙ ПОДГОТОВКИ</text>

  <!-- Main H1 Headline -->
  <text x="620" y="240" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', 'Unbounded', sans-serif" font-size="44" font-weight="900" letter-spacing="0.5">
    ФУТБОЛ ДЛЯ ДЕТЕЙ: <tspan fill="url(#goldGrad)">ЦСП «СПАРТА»</tspan>
  </text>
  <text x="620" y="295" text-anchor="middle" fill="#00D06C" font-family="'Inter', 'Unbounded', sans-serif" font-size="42" font-weight="900" letter-spacing="0.5">
    ОТКРЫВАЕТ НАБОР В НОВОСИБИРСКЕ
  </text>

  <!-- Soul Text -->
  <text x="620" y="350" text-anchor="middle" fill="#E6E8E6" font-family="'Inter', 'Onest', sans-serif" font-size="18" font-weight="400">
    Воспитываем характер, развиваем силу и лидерские качества с ранних лет
  </text>
  <text x="620" y="376" text-anchor="middle" fill="#E6E8E6" font-family="'Inter', 'Onest', sans-serif" font-size="18" font-weight="400">
    в атмосфере дружбы, профессионализма и всесторонней поддержки.
  </text>

  <!-- Center Placeholder Area for Boy Photo -->
  <rect x="120" y="440" width="1000" height="740" rx="24" fill="#111613" fill-opacity="0.2" stroke="#D4AF37" stroke-opacity="0.2" stroke-dasharray="8 8"/>
  <text x="620" y="810" text-anchor="middle" fill="#8E9891" font-family="'Inter', sans-serif" font-size="18" font-weight="500">
    [ Область для фото: sparta-boy-soccer.jpg ]
  </text>

  <!-- ================= BOTTOM CONTAINER ================= -->
  <!-- Bottom Gradient Overlay -->
  <rect x="0" y="1120" width="1240" height="634" fill="url(#bottomShadow)"/>

  <!-- 3 Cards -->
  <!-- Card 1: 0 Rub -->
  <g transform="translate(60, 1220)">
    <rect width="353" height="150" rx="18" fill="#111613" fill-opacity="0.8" stroke="#00D06C" stroke-opacity="0.7" stroke-width="1.5"/>
    <text x="24" y="52" fill="#00D06C" font-family="'Inter', 'Unbounded', sans-serif" font-size="34" font-weight="900">0 ₽</text>
    <text x="24" y="85" fill="#FFFFFF" font-family="'Inter', 'Montserrat', sans-serif" font-size="17" font-weight="700">Пробная тренировка</text>
    <text x="24" y="112" fill="#E6E8E6" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Бесплатное первое занятие</text>
    <text x="24" y="130" fill="#E6E8E6" font-family="'Inter', sans-serif" font-size="13" font-weight="400">и знакомство с тренером</text>
  </g>

  <!-- Card 2: Gift Ball -->
  <g transform="translate(443, 1220)">
    <rect width="353" height="150" rx="18" fill="#111613" fill-opacity="0.8" stroke="#D4AF37" stroke-opacity="0.5" stroke-width="1"/>
    <text x="24" y="52" fill="url(#goldGrad)" font-family="'Inter', 'Unbounded', sans-serif" font-size="24" font-weight="900">Мяч в подарок ⚽</text>
    <text x="24" y="85" fill="#FFFFFF" font-family="'Inter', 'Montserrat', sans-serif" font-size="17" font-weight="700">Фирменный подарок</text>
    <text x="24" y="112" fill="#E6E8E6" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Дарим мяч SPARTA при покупке</text>
    <text x="24" y="130" fill="#E6E8E6" font-family="'Inter', sans-serif" font-size="13" font-weight="400">первого абонемента</text>
  </g>

  <!-- Card 3: License -->
  <g transform="translate(826, 1220)">
    <rect width="353" height="150" rx="18" fill="#111613" fill-opacity="0.8" stroke="#D4AF37" stroke-opacity="0.5" stroke-width="1"/>
    <text x="24" y="52" fill="url(#goldGrad)" font-family="'Inter', 'Unbounded', sans-serif" font-size="24" font-weight="900">Гослицензия 🏆</text>
    <text x="24" y="85" fill="#FFFFFF" font-family="'Inter', 'Montserrat', sans-serif" font-size="17" font-weight="700">Лицензия + Заморозка</text>
    <text x="24" y="112" fill="#E6E8E6" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Официальный статус, вычет 13%</text>
    <text x="24" y="130" fill="#E6E8E6" font-family="'Inter', sans-serif" font-size="13" font-weight="400">и сохранение занятий</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(60, 1400)">
    <rect width="1120" height="76" rx="20" fill="url(#emeraldGrad)" stroke="#D4AF37" stroke-width="2"/>
    <text x="560" y="47" text-anchor="middle" fill="#FFFFFF" font-family="'Inter', 'Unbounded', sans-serif" font-size="21" font-weight="800" letter-spacing="1">
      ЗАПИСАТЬСЯ НА БЕСПЛАТНУЮ ТРЕНИРОВКУ →
    </text>
  </g>

  <!-- Contact Bar -->
  <g transform="translate(60, 1500)">
    <rect width="1120" height="84" rx="20" fill="#111613" fill-opacity="0.9" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1"/>
    
    <!-- Phone -->
    <text x="35" y="38" fill="#FFFFFF" font-family="'Inter', 'Unbounded', sans-serif" font-size="18" font-weight="700">📞 +7 (383) 383-00-15</text>
    <text x="35" y="62" fill="#E6E8E6" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Ежедневно 09:00 — 21:00</text>

    <!-- Address -->
    <text x="420" y="38" fill="#FFFFFF" font-family="'Inter', 'Unbounded', sans-serif" font-size="18" font-weight="700">📍 г. Новосибирск</text>
    <text x="420" y="62" fill="#E6E8E6" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Филиалы и залы в вашем районе</text>

    <!-- Site / QR -->
    <text x="850" y="38" fill="#F3E5AB" font-family="'Inter', 'Unbounded', sans-serif" font-size="17" font-weight="700">🌐 sparta-sports.ru</text>
    <text x="850" y="62" fill="#E6E8E6" font-family="'Inter', sans-serif" font-size="13" font-weight="400">Быстрая онлайн-запись</text>
  </g>
</svg>
