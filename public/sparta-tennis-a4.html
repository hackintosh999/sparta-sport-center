<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЦСП СПАРТА — Большой теннис (Формат А4 с крупным золотым гербом)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    body {
      width: 1240px;
      height: 1754px;
      overflow: hidden;
      background-color: #062320;
      font-family: 'Montserrat', sans-serif;
      position: relative;
    }

    .poster-a4 {
      width: 1240px;
      height: 1754px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 50px 32px 50px;
    }

    .bg-photo {
      position: absolute;
      top: 0;
      left: 0;
      width: 1240px;
      height: 1754px;
      object-fit: cover;
      z-index: 1;
    }

    .content-layer {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ==================== ВЕРХ: КРУПНЫЙ ЗОЛОТОЙ ГЕРБ И ЗАГОЛОВОК ==================== */
    .top-title-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 0px;
      margin-bottom: auto;
    }

    .gold-crest-tennis {
      width: 155px;
      height: auto;
      filter: drop-shadow(0 6px 18px rgba(255, 215, 0, 0.55));
      margin-bottom: 8px;
    }

    .tn-nadpis {
      font-size: 32px;
      font-weight: 900;
      color: #0B4E49;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(255, 255, 255, 0.90);
      margin-bottom: 2px;
    }

    .title-3d-mint {
      font-size: 150px;
      font-weight: 900;
      line-height: 0.88;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: #E0FFF8;
      text-shadow: 
        0px 2px 0px #0F4D52,
        0px 3px 0px #0D454A,
        0px 4px 0px #0B3E42,
        0px 5px 0px #09373B,
        0px 6px 0px #083033,
        0px 7px 0px #06282B,
        0px 8px 0px #052123,
        0 14px 28px rgba(0, 0, 0, 0.70);
      -webkit-text-stroke: 1.8px #FFFFFF;
    }

    .title-3d-mint span {
      display: block;
    }

    /* ==================== 4 КАРТОЧКИ ПРЕИМУЩЕСТВ (2x2 GRID) ==================== */
    .benefits-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 20px;
      margin-bottom: 20px;
      margin-top: auto;
    }

    .benefit-card {
      position: relative;
      height: 124px;
      background: linear-gradient(90deg, rgba(126, 251, 208, 0.92) 0%, rgba(100, 220, 215, 0.88) 38%, rgba(181, 137, 214, 0.92) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid #FFFFFF;
      border-radius: 22px;
      box-shadow: 
        0 10px 24px rgba(0, 0, 0, 0.45),
        inset 0 2.5px 4px rgba(255, 255, 255, 0.95),
        inset 0 -2.5px 4px rgba(5, 58, 52, 0.35);
      display: flex;
      align-items: center;
      padding: 12px 22px;
      gap: 18px;
    }

    .card-icon {
      width: 88px;
      height: 88px;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.45));
      flex-shrink: 0;
    }

    .card-text {
      color: #FFFFFF;
      font-size: 28.5px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: 0.2px;
      text-shadow: 
        2.5px 3px 0px #2A0845,
        0 4px 10px rgba(0, 0, 0, 0.55);
      -webkit-text-stroke: 0.4px rgba(255, 255, 255, 0.95);
    }

    /* ==================== ПОДВАЛ (3 АДРЕСА) ==================== */
    .footer-panel {
      width: 100%;
      background: rgba(6, 28, 26, 0.97);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid #26C6DA;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.60), 0 0 20px rgba(38, 198, 218, 0.25);
      padding: 20px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }

    .footer-col {
      display: flex;
      align-items: center;
      gap: 20px;
      flex: 1;
    }

    .footer-icon-box {
      width: 56px;
      height: 56px;
      flex-shrink: 0;
    }

    .footer-icon-box svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 8px rgba(38, 198, 218, 0.45));
    }

    .footer-text {
      font-size: 23px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.38;
      letter-spacing: 0.2px;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div class="poster-a4">
    <img src="/banner-assets/sparta-tennis-a4-clean-bg.jpg" alt="Большой теннис Спарта" class="bg-photo">

    <div class="content-layer">
      
      <!-- ВЕРХ: КРУПНЫЙ ЗОЛОТОЙ ГЕРБ + ЗАГОЛОВОК -->
      <div class="top-title-group">
        <img src="/banner-assets/sparta-crest-gold.png" alt="ЦСП Спарта" class="gold-crest-tennis">
        <div class="tn-nadpis">ЦСП «СПАРТА» ОТКРЫВАЕТ НОВОЕ НАПРАВЛЕНИЕ:</div>
        <h1 class="title-3d-mint">
          <span>БОЛЬШОЙ</span>
          <span>ТЕННИС</span>
        </h1>
      </div>

      <!-- 4 КАРТОЧКИ ПРЕИМУЩЕСТВ -->
      <div class="benefits-grid">
        
        <div class="benefit-card">
          <img src="/banner-assets/tennis-icon-gift.png" alt="Пробная тренировка" class="card-icon">
          <div class="card-text">
            <div>Пробная</div>
            <div>тренировка 0 ₽</div>
          </div>
        </div>

        <div class="benefit-card">
          <img src="/banner-assets/tennis-icon-ice.png" alt="Заморозка" class="card-icon">
          <div class="card-text">
            <div>Заморозка</div>
            <div>при болезни</div>
          </div>
        </div>

        <div class="benefit-card">
          <img src="/banner-assets/tennis-icon-license.png" alt="Гос лицензия" class="card-icon">
          <div class="card-text">
            <div>Гос. лицензия</div>
          </div>
        </div>

        <div class="benefit-card">
          <img src="/banner-assets/tennis-icon-tax.png" alt="Налоговый вычет" class="card-icon">
          <div class="card-text">
            <div>Налоговый</div>
            <div>вычет 13%</div>
          </div>
        </div>

      </div>

      <!-- ПОДВАЛ (3 АДРЕСА) -->
      <div class="footer-panel">
        
        <!-- Левая колонка: Телефоны -->
        <div class="footer-col">
          <div class="footer-icon-box">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="24" r="22" fill="rgba(38, 198, 218, 0.18)" stroke="#26C6DA" stroke-width="2"/>
              <path d="M32 27.5V30.5C32 31.5 31 32.5 30 32.5C21 32 16 27 15.5 18C15.5 17 16.5 16 17.5 16H20.5C21.5 16 22.3 16.8 22.5 17.8C22.7 19 23.2 20.2 23.9 21.2C24.4 21.9 24.2 22.8 23.5 23.3L22.2 24.3C23.4 26.5 25.5 28.6 27.7 29.8L28.7 28.5C29.2 27.8 30.1 27.6 30.8 28.1C31.8 28.8 33 29.3 34.2 29.5C35.2 29.7 36 30.5 36 31.5" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="footer-text">
            <div>+7 919 339 33 99 (Директор)</div>
            <div>+7 (351) 230-12-69 (Админ)</div>
          </div>
        </div>

        <!-- Правая колонка: 3 Адреса -->
        <div class="footer-col">
          <div class="footer-icon-box">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="24" r="22" fill="rgba(38, 198, 218, 0.18)" stroke="#26C6DA" stroke-width="2"/>
              <path d="M24 13C19.5 13 16 16.5 16 21C16 26.5 24 35 24 35C24 35 32 26.5 32 21C32 16.5 28.5 13 24 13Z" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round"/>
              <circle cx="24" cy="21" r="3.5" fill="#26C6DA"/>
            </svg>
          </div>
          <div class="footer-text">
            <div>ул. Большевистская 125,</div>
            <div>ул. Планетная 53,</div>
            <div>ул. Мясниковой 25/2</div>
          </div>
        </div>

      </div>

    </div>
  </div>
</body>
</html>
